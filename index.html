<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taskboard · Multi-user</title><link rel="stylesheet" href="style.css"></head><body>
<div id="loginPage" class="login-bg"><form id="loginForm" class="login-card"><div class="mark">▦</div><h1>Taskboard</h1><p class="muted">Masuk menggunakan akun yang dibuat Admin</p><label>Email<input type="email" id="loginEmail" required autocomplete="username" placeholder="nama@contoh.com"></label><label>Password<input type="password" id="loginPassword" required autocomplete="current-password"></label><p id="loginError" class="error"></p><button class="primary wide" id="loginButton">Login</button><small class="muted">Supabase Authentication · Protected by RLS</small></form></div>
<div id="app" class="hidden"><header class="header"><div class="logo"><span class="mark smallmark">▦</span><span>Taskboard<small>Personal work management</small></span></div><div class="header-actions"><span id="currentIdentity" class="muted"></span><button id="signoutButton" class="subtle">Logout</button></div></header>
<main class="main"><section id="adminPage" class="hidden"><div class="heading"><div><h1>User Management</h1><p class="muted">Admin hanya mengelola akun. Tidak ada dashboard tugas Admin.</p></div><button class="primary" id="newUserButton">+ Add User</button></div><div class="panel table-scroll"><table><thead><tr><th>Username</th><th>Name / Email</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody id="userRows"></tbody></table></div></section>
<section id="dashboardPage" class="hidden"><div class="heading"><div><h1 id="pageTitle">My Dashboard</h1><p id="viewCaption" class="muted">Tasks & progress at a glance</p></div><div class="toolbar"><label id="accountPickerWrap" class="picker hidden">View Account <select id="accountPicker"></select></label><input id="search" placeholder="Search tasks…" aria-label="Search tasks"><select id="priorityPicker" aria-label="Priority"><option value="">All priorities</option><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select><button class="subtle" id="refreshButton">↻ Refresh</button><button class="primary" id="newTaskButton">+ New Task</button></div></div><div class="stats" id="stats"></div><div id="board" class="board"></div></section></main></div>
<div id="overlay" class="overlay hidden"><div class="dialog" role="dialog" aria-modal="true"><div id="modalContent"></div></div></div>
<div id="toast" class="toast hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></body></html>
